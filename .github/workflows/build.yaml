'env':
  'BASE_IMAGE': |-
    ${{ vars.BASE_IMAGE || 'adguard/go-builder:1.27.1--1' }}
  'BUILD_DIR': |-
    build
  'CLIENT_DIR': |-
    ${{ inputs.client_dir || 'client_v2' }}
  'DIST_DIR': |-
    dist
  'FRONTEND_BASE_IMAGE': |-
    ${{ vars.FRONTEND_BASE_IMAGE || 'adguard/home-js-builder:4.0' }}
'jobs':
  'Build':
    'if': |
      ${{ github.repository_owner == 'AdGuardSoftwareLimited' }}
    'permissions':
      'contents': 'read'
    'runs-on': 'team-go'
    'steps':
      - 'uses': 'actions/checkout@v6'
        'with':
          # Set to false to avoid GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485#issuecomment-934422611.
          'persist-credentials': false
      - 'name': 'Build frontend'
        'uses': 'AdGuardSoftwareLimited/actions/actions/docker-build@master'
        'with':
          'dockerfile': 'docker/frontend.Dockerfile'
          'context': '.'
          'target': 'builder-exporter'
          'output': '.'
          'build-args': |
            BASE_IMAGE=${{ env.FRONTEND_BASE_IMAGE }}
            CACHE_BUSTER=${{ inputs.cache_buster || '0' }}
            CLIENT_DIR=${{ env.CLIENT_DIR }}
            DIST_DIR=${{ env.BUILD_DIR }}
      - 'uses': 'actions/upload-artifact@v7'
        'with':
          'name': 'adguardhomefrontend'
          'path': |
            ${{ env.BUILD_DIR }}
      - 'name': 'Set source date epoch'
        'run': |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - 'name': 'Build QA artifacts'
        'uses': 'AdGuardSoftwareLimited/actions/actions/docker-build@master'
        'with':
          'dockerfile': 'docker/ci.Dockerfile'
          'context': '.'
          'target': 'builder-exporter'
          'output': '.'
          'build-args': |
            ARCH=amd64 arm64
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            BRANCH=${{ github.ref_name }}
            CACHE_BUSTER=${{ inputs.cache_buster || '0' }}
            CHANNEL=development
            DIST_DIR=${{ env.DIST_DIR }}
            OS=windows darwin linux
            REVISION=${{ github.sha }}
            SIGN=0
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            VERSION=${{ github.ref_name }}
      - 'uses': 'actions/upload-artifact@v7'
        'with':
          'name': 'adguardhome'
          'path': |
            ${{ env.DIST_DIR }}/AdGuardHome_windows_amd64.zip
            ${{ env.DIST_DIR }}/AdGuardHome_darwin_amd64.zip
            ${{ env.DIST_DIR }}/AdGuardHome_darwin_arm64.zip
            ${{ env.DIST_DIR }}/AdGuardHome_linux_amd64.tar.gz
  'TestE2E':
    'if': |
      ${{ github.repository_owner == 'AdGuardSoftwareLimited' }}
    'needs': 'Build'
    'permissions':
      'contents': 'read'
    'runs-on': 'team-go'
    'steps':
      - 'uses': 'actions/checkout@v6'
        'with':
          # Set to false to avoid GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485#issuecomment-934422611.
          'persist-credentials': false
      - 'uses': 'actions/download-artifact@v8'
        'with':
          'name': 'adguardhomefrontend'
          'path': |
            ${{ env.BUILD_DIR }}
      - 'uses': 'actions/download-artifact@v8'
        'with':
          'name': 'adguardhome'
          'path': |
            ${{ env.DIST_DIR }}
      - 'run': |
          #!/bin/sh

          set -e -f -u -x

          tar -xzf ${{ env.DIST_DIR }}/AdGuardHome_linux_amd64.tar.gz -C /tmp

          mv /tmp/AdGuardHome/AdGuardHome ./AdGuardHome
      - 'name': 'Run tests'
        'uses': 'AdGuardSoftwareLimited/actions/actions/docker-build@master'
        'with':
          'dockerfile': 'docker/frontend.Dockerfile'
          'context': '.'
          'target': 'e2etester'
          # No output: exporting the e2etester filesystem hangs the build.
          'build-args': |
            BASE_IMAGE=${{ env.FRONTEND_BASE_IMAGE }}
            CACHE_BUSTER=${{ inputs.cache_buster || '0' }}
            CLIENT_DIR=${{ env.CLIENT_DIR }}
  'BuildFork':
    # Fork-friendly QA build.  Unlike Build and TestE2E above, which require
    # AdGuard's private runners, private actions, and private base images,
    # this job runs on public runners and only uses public resources, so it
    # works on forks.  It intentionally builds linux/amd64 only to stay
    # within free-tier minutes; extend platforms once caching is set up.
    'if': |
      ${{ github.repository_owner != 'AdGuardSoftwareLimited' }}
    'permissions':
      'contents': 'read'
    'runs-on': 'ubuntu-latest'
    'steps':
      - 'uses': 'actions/checkout@v6'
        'with':
          # Set to false to avoid GITHUB_TOKEN leaking.
          #
          # See https://github.com/actions/checkout/issues/485#issuecomment-934422611.
          'persist-credentials': false
      - 'name': 'Set up QEMU'
        'uses': 'docker/setup-qemu-action@v3'
      - 'name': 'Set up Docker Buildx'
        'uses': 'docker/setup-buildx-action@v3'
        'with':
          'install': true
      - 'name': 'Build frontend'
        'run': |
          #!/bin/sh

          set -e -f -u -x

          docker buildx build \
              --build-arg "BASE_IMAGE=${{ env.FRONTEND_BASE_IMAGE }}" \
              --build-arg "CLIENT_DIR=${{ env.CLIENT_DIR }}" \
              --build-arg "DIST_DIR=${{ env.BUILD_DIR }}" \
              --output '.' \
              --target 'builder-exporter' \
              -f 'docker/frontend.Dockerfile' \
              .
      - 'name': 'Set source date epoch'
        'run': |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - 'name': 'Build backend (linux/amd64)'
        # Empty signing secrets: the builder stage references them under
        # set -u, so they must exist even though SIGN=0 never uses them.
        'env':
          'GPG_KEY_PASSPHRASE': ''
          'GPG_SECRET_KEY': ''
          'SIGNER_API_KEY': ''
        'run': |
          #!/bin/sh

          set -e -f -u -x

          docker buildx build \
              --build-arg "ARCH=amd64" \
              --build-arg "BASE_IMAGE=${{ env.BASE_IMAGE }}" \
              --build-arg "BRANCH=${{ github.ref_name }}" \
              --build-arg "CHANNEL=edge" \
              --build-arg "DIST_DIR=${{ env.DIST_DIR }}" \
              --build-arg "OS=linux" \
              --build-arg "REVISION=${{ github.sha }}" \
              --build-arg "SIGN=0" \
              --build-arg "SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}" \
              --build-arg "VERSION=${{ github.ref_name }}" \
              --secret 'id=GPG_KEY_PASSPHRASE,env=GPG_KEY_PASSPHRASE' \
              --secret 'id=GPG_SECRET_KEY,env=GPG_SECRET_KEY' \
              --secret 'id=SIGNER_API_KEY,env=SIGNER_API_KEY' \
              --output '.' \
              --platform 'linux/amd64' \
              --target 'builder-exporter' \
              -f 'docker/ci.Dockerfile' \
              .
      - 'uses': 'actions/upload-artifact@v7'
        'with':
          'name': 'adguardhome-fork'
          'path': |
            ${{ env.DIST_DIR }}/AdGuardHome_linux_amd64.tar.gz
'name': 'Build and Test QA Artifacts'
'on':
  'push':
    'branches':
      - '*'
  'workflow_dispatch':
    'inputs':
      'cache_buster':
        'default': ''
        'description': |
          Override to force re-run of cached stages (pass any unique value).
        'type': 'string'
# Permissions are disabled for all the jobs by default, and then overridden for
# specific jobs if needed.  This is a recommended practice for security reasons,
# and also allows to avoid mistakes with permissions when creating new jobs.
#
# See https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions.
'permissions': {}
