checks = [
  "all"
  # SA4023 assumes a callee returns the same set of values on every platform.
  # Interface helpers such as aghnet.IfaceSetStaticIP always fail on Windows and
  # the BSDs, so their callers' nil checks look redundant under those GOOSes
  # even though they are required on Linux and macOS.  Line-based directives
  # cannot be restricted to a single build configuration, so disable the check
  # rather than weaken the callers.
, "-SA4023"
]

initialisms = [
  # See https://github.com/dominikh/go-tools/blob/master/config/config.go.
  #
  # Do not add "PTR" since we use "Ptr" as a suffix.
  "inherit"
, "ASN"
, "DHCP"
, "DNSSEC"
  # E.g. SentryDSN.
, "DSN"
, "ECS"
, "EDNS"
, "MX"
, "QUIC"
, "RA"
, "RRSIG"
, "SDNS"
, "SLAAC"
, "SOA"
, "SVCB"
, "TLD"
, "WHOIS"
]
dot_import_whitelist = []
http_status_code_whitelist = []
