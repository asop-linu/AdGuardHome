'jobs':
  'mirror':
    'if': |
      ${{ github.repository_owner == 'AdGuardSoftwareLimited' }}
    'permissions':
      'actions': 'write'
      'contents': 'read'
      'id-token': 'write'
    'uses': 'AdGuardSoftwareLimited/actions/.github/workflows/mirror.yml@master'
    'with':
      'disable_workflows_source': 'workflow.yaml'
      'disable_workflows_target': 'build.yaml mirror.yaml private.yaml'
      'target_repo': 'git@github.com:AdguardTeam/AdGuardHome.git'
      'team': 'go'
'name': 'Mirror'
'on':
  # NOTE: This workflow mirrors master to AdguardTeam/AdGuardHome using
  # AdGuard's private mirror action, so it can only ever run there.  On
  # forks the private reusable workflow reference cannot even be resolved,
  # which fails the whole run during setup despite the owner gate below.
  # Keep the file for upstream sync, but never trigger it here.
  'push':
    'branches': ['never-match-any-branch']
  'workflow_dispatch': null
# Permissions are disabled for all the jobs by default, and then overridden for
# specific jobs if needed.  This is a recommended practice for security reasons,
# and also allows to avoid mistakes with permissions when creating new jobs.
#
# See https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions.
'permissions': {}
